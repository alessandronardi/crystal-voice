name: CI

on:
  push:
    branches: [main, "issue/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; pnpm version from "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # I-04: fixtures must hash identically to the committed manifest on this
      # runner, then the offline harness runs on them (DoD: under 2 minutes [H]).
      - name: fixtures (determinism check, then generate)
        run: pnpm fixtures --check && pnpm fixtures
        timeout-minutes: 5
      - name: bench
        run: pnpm bench
        # DoD I-04: under 2 minutes [H] (today with the signal-summary-0 analyzer only).
        timeout-minutes: 2
      # I-05b: libfvad modes and the pre-filter on the fixtures (Silero runs only locally, ADR-0023).
      - name: bench VAD
        run: pnpm bench:vad
        timeout-minutes: 2
      # I-06a: extractor-0-experimental on the fixtures (tables of BENCHMARK_PROTOCOL §7; fails only on error).
      - name: bench descriptors
        run: pnpm bench:descriptors
        timeout-minutes: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-report
          path: |
            tests/benchmarks/out/latest.json
            tests/benchmarks/out/vad-latest.json
            tests/benchmarks/out/descriptors.json
          retention-days: 30
      # ADR-0027: no extension artifact before G0 (the build is not distributed).
      - run: pnpm build

  e2e:
    name: e2e (Chromium, extension loaded)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # I-18: file.spec.ts loads the WAV fixtures, which are generated, not committed (R16).
      - run: pnpm fixtures
        timeout-minutes: 5
      # Headed under a virtual display: headless support is documented in tests/e2e/README.md.
      - run: xvfb-run --auto-servernum pnpm test:e2e

  fvad-wasm:
    # I-05b (D-L): libfvad is compiled by the project in a pinned Emscripten
    # image; the committed module must be byte-identical to a fresh build.
    name: libfvad WASM (reproducible build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build in emscripten/emsdk (pinned by digest)
        run: bash scripts/vad/build-fvad-docker.sh "$RUNNER_TEMP/fvad"
        timeout-minutes: 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fvad-wasm
          path: ${{ runner.temp }}/fvad/
          retention-days: 7
      - name: compare with the committed module
        run: |
          cat "$RUNNER_TEMP/fvad/fvad.wasm.sha256"
          cmp "$RUNNER_TEMP/fvad/fvad.wasm" packages/dsp-core/wasm/fvad.wasm
          (cd packages/dsp-core/wasm && sha256sum -c fvad.wasm.sha256)
      # I-06b (D-X): the license texts shipped in the bundle are the ones of this build.
      - name: compare the license notices with THIRD_PARTY
        run: |
          cmp "$RUNNER_TEMP/fvad/LICENSE" THIRD_PARTY/libfvad/LICENSE
          cmp "$RUNNER_TEMP/fvad/PATENTS" THIRD_PARTY/libfvad/PATENTS
          for f in "$RUNNER_TEMP"/fvad/notices/*.txt; do cmp "$f" "THIRD_PARTY/emscripten/$(basename "$f")"; done
          test "$(ls "$RUNNER_TEMP"/fvad/notices/*.txt | wc -l)" -eq "$(ls THIRD_PARTY/emscripten/*.txt | wc -l)"

  golden-browsers:
    name: golden hashes (Chromium, Firefox)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:golden
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:golden:browsers
      - run: pnpm bench:continuity
        timeout-minutes: 5
      - run: pnpm bench:robustness
        timeout-minutes: 5
      - run: pnpm bench:plate-scale
        timeout-minutes: 5

  render-three:
    name: renderer-three (Chromium, SwiftShader)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Software WebGL: screenshots, leaks, context loss. Not a frame-time or GPU-memory measure (I-11).
      - run: pnpm test:render
        timeout-minutes: 45
